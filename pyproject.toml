[project]
name = "forecast"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "rahulc0dy", email = "rc645312@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "pandas>=3.1.0",
    "scikit-learn>=1.9.1",
]

[project.scripts]
forecast = "forecast.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "jupyterlab>=4.6.4",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]
